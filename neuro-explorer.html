<!DOCTYPE html>

<style>
:root{--b:#3b82f6;--p:#8b5cf6;--k:#ec4899;--ink:#1e1b4b}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:linear-gradient(160deg,#e0ecff,#f3e8ff 60%,#ffe4f1);color:var(--ink);min-height:100vh;font-size:18px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:#ffffffee;padding:8px 12px}

button:hover:not(:disabled){transform:translateY(-2px)}button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
.big{font-size:1.3rem;padding:14px 26px;background:linear-gradient(90deg,var(--b),var(--k));box-shadow:0 4px 0 #6d28d9}

.wave{transform-origin:77px 80px;animation:wv 1.6s ease-in-out infinite}@keyframes wv{50%{transform:rotate(-30deg)}}
.node{display:block;background:#ede9fe;border:3px solid #c4b5fd;border-radius:16px;padding:8px 12px;text-align:center;transition:.3s}
.on{background:#fde047!important;border-color:#f59e0b!important;box-shadow:0 0 18px #facc15;transform:scale(1.04)}
.on::after{content:" ⚡"}
.ar{text-align:center;font-size:1.4rem}
.pos{padding:18px;font-size:1.05rem}.pos.dn{background:#16a34a;box-shadow:0 4px 0 #166534}
.box{background:#fef9c3;border:3px dashed #f59e0b;border-radius:16px;padding:10px;min-height:56px;margin:8px 0}
.bod{width:200px;max-width:60vw;display:block;margin:auto}.hot{cursor:pointer;transition:.2s}.hot:hover{filter:brightness(1.15) drop-shadow(0 0 6px #facc15)}
#dt{transition:transform 1s ease-in-out;filter:drop-shadow(0 0 8px #facc15)}
.brain{width:170px;display:block;margin:auto;animation:gp 2s ease-in-out infinite alternate}@keyframes gp{to{filter:drop-shadow(0 0 14px #f472b6)}}
.zone{border:4px dashed #a78bfa;border-radius:18px;min-height:130px;padding:8px;background:#faf5ff}
.fb{margin-top:8px}.opt.good{background:#16a34a;color:#fff;opacity:1!important}.opt.bad{background:#fecaca;opacity:1!important}
.star{font-size:2rem;text-align:center;animation:pp .8s}@keyframes pp{from{transform:scale(0)}to{transform:scale(1)}}
.shake{animation:sh .5s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.vid{aspect-ratio:16/9;background:linear-gradient(135deg,#312e81,#7c3aed);border-radius:16px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.vic{font-size:4rem}
table{border-collapse:collapse;width:100%}td,th{border:2px solid #c4b5fd;padding:6px;text-align:center}

.tm{font-size:2.4rem;font-weight:800;text-align:center}
.badge{font-size:4rem;text-align:center;animation:pp 1s}
nav{position:sticky;bottom:0;background:#ffffffee;padding:6px;z-index:5}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;animation:cf 2.8s linear forwards}@keyframes cf{to{transform:translateY(115vh) rotate(720deg)}}
#hp{position:fixed;right:10px;bottom:84px;max-width:340px;z-index:9;background:#fff;border:3px solid var(--p);border-radius:18px;padding:10px;box-shadow:0 8px 24px #0004}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:8px 16px;border-radius:12px;z-index:20;display:none;max-width:90vw}
.tw{animation:tw 2s infinite alternate}@keyframes tw{to{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){body{font-size:16px}h1{font-size:1.7rem}.say{flex-direction:column;text-align:center}}
</style></head><body>

/* audio */
function msg(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(S.mt);S.mt=setTimeout(()=>e.style.display='none',3200)}
function speak(t){try{if(!('speechSynthesis' in window)){msg('Browser ini belum mendukung suara. Kamu tetap bisa membaca teksnya ya 😊');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.95;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('id'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){msg('Suara tidak tersedia saat ini.')}}

function pick(n){$('#inf').innerHTML='<b>'+n+'</b><br>'+BIO[n];['Nero','Nara','Nura'].forEach(x=>$('#k'+x).classList.remove('float'));$('#k'+n).classList.add('float');if(!S.mute)speak(BIO[n])}

function kirim(){$('#ks').disabled=true;const H=[43,182],Sp=[100,140],B=[100,40];runDot([H,Sp,B,Sp,H],['⚡ Rangsangan dari tangan masuk...','🦴 Sinyal lewat sumsum tulang belakang...','🧠 Sinyal sampai di otak!','🦴 Perintah dari otak turun lewat sumsum tulang belakang...','✋ Perintah sampai di tangan! Selesai.'],1300,()=>{$('#ks').disabled=false})}
function runDot(pts,labs,ms,done){const d=$('#dt');let i=0;(function n(){if(i>=pts.length){done&&done();return}d.style.transform='translate('+pts[i][0]+'px,'+pts[i][1]+'px)';$('#sg').textContent=labs[i];i++;S.tm.push(setTimeout(n,ms))})()}
function wrun(){flow(STEP.map((s,i)=>'w'+i),2700,i=>{$('#nb').innerHTML=say('Nura',(i+1)+'. '+STEP[i][1],'happy',80);if(!S.mute)speak(STEP[i][1])},()=>{$('#nb').innerHTML=say('Nura','Selesai! Begitulah rangsangan menjadi tindakan.','cheer',80)})}
function hrun(){flow(HOT.map((h,i)=>'h'+i),1500,i=>{if(i==0){$('#nr').innerHTML=cast('Nara','wow',130);$('#hb').innerHTML=say('Nara','Aduh, panas!','wow',70);if(!S.mute)speak('Aduh, panas!')}if(i==6)$('#nr').style.transform='translateX(-60px)'},()=>{$('#hb').innerHTML=say('Nara','Aduh, panas!','wow',70)+say('Nura','Rangsangan panas diterima reseptor kulit, dikirim saraf sensorik ke pusat saraf, lalu saraf motorik menyuruh otot menarik tangan. Prosesnya sangat cepat, itulah gerak refleks!','cheer',70)})}
function dg(e,i){e.dataTransfer.setData('text/plain',i)}
function dp(e,z){e.preventDefault();e.stopPropagation();const i=parseInt(e.dataTransfer.getData('text/plain'));if(!isNaN(i))place(i,z)}
function sel(i){if(S.pl&&S.pl[i])return;S.sel=i;document.querySelectorAll('#pool button').forEach(b=>b.classList.remove('on'));$('#c'+i).classList.add('on');$('#fb').textContent='Sekarang klik area GERAK SADAR atau GERAK REFLEKS.'}
function zc(z){if(S.sel!=null)place(S.sel,z)}
function place(i,z){S.pl=S.pl||{};if(S.pl[i])return;const it=ITEMS[i],b=$('#c'+i);if(it[1]===z){S.pl[i]=1;b.classList.remove('on');b.disabled=true;b.draggable=false;$('#z'+z).querySelector('.row').appendChild(b);S.sel=null;S.cnt++;tone();$('#fb').innerHTML='🎉 Hebat! Kamu berhasil!';if(S.cnt==ITEMS.length){confetti();$('#fb').innerHTML='🎉 Hebat! Semua kartu tepat! Tekan LANJUT.'}}else{$('#fb').textContent='Belum tepat. Coba pikirkan apakah gerakan tersebut dilakukan secara sadar atau merupakan respons cepat tubuh.';b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),600)}}
function vshow(){const k=Math.min(6,Math.floor(S.vt/5));$('#vi').textContent=CH[k][0];$('#vt').textContent=CH[k][1];$('#vb').style.width=(S.vt/35*100)+'%';if(S.vk!==k){S.vk=k;if(!S.mute)speak(CH[k][1])}}

function vpause(){S.vp=0;clearInterval(S.iv2);stopS()}

function estE(){if(!S.run){msg('Tekan MULAI dulu ya!');return}clearInterval(S.iv);S.run=0;const t=((Date.now()-S.t0)/1000).toFixed(2);S.lab.est=t;$('#tm').textContent=t;$('#ef').innerHTML='<b>Waktu respons: '+t+' detik</b>. '+(S.sn==5?'Kerja sama kalian lancar!':'Coba lagi sampai efektor ya!')}
function qz(ids){S.qs=ids;S.qi=0;S.lock=true;upd();rq()}
function rq(){const q=QS[S.qs[S.qi]],n=S.qs[S.qi]+1;S.ans=0;S.txt='Misi '+n+'. '+q.t;$('#qz').innerHTML='<h2>Misi '+n+' dari 5</h2><p>'+q.t+'</p>'+lis()+'<div class="grid3">'+q.o.map((o,i)=>'<button class="w opt" onclick="ans('+i+')">'+(q.tf?'':'ABCD'[i]+'. ')+o+'</button>').join('')+'</div><div class="fb" id="fb" aria-live="polite"></div><div class="row" id="qn"></div>'}
function ans(i){if(S.ans)return;S.ans=1;const id=S.qs[S.qi],q=QS[id],ok=i===q.a;if(!(id in S.qa)){S.qa[id]=ok;if(ok)S.score++}
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('good');else if(j===i)b.classList.add('bad')});
$('#fb').innerHTML=ok?'<div class="star">⭐⭐⭐</div>'+say('Nura','🎉 Hebat! Jawabanmu benar! '+q.e,'cheer',80):say('Nura','Belum tepat. Jawaban yang benar adalah '+q.o[q.a].replace(/[🟢🔴] /u,'')+'. '+q.e+' Kamu tetap hebat karena sudah berani mencoba!','sad',80);
if(ok)tone();const last=S.qi==S.qs.length-1;$('#qn').innerHTML=(ok?'':'<button class="w" onclick="rq()">🔁 Coba lagi</button>')+'<button class="g" onclick="nq()">'+(last?'Selesai ✔':'Soal berikutnya ▶')+'</button>'}
function nq(){if(S.qi<S.qs.length-1){S.qi++;rq();return}if(S.qs.length===3){go(15);return}confetti();S.lock=false;upd();S.txt='Semua misi selesai!';$('#qz').innerHTML='<h2>🎉 SEMUA MISI SELESAI!</h2><div class="badge">🏆</div><p style="text-align:center">Skor kamu: <b>'+S.score+'/5</b></p>'+say('Nura','Kamu hebat! Berani mencoba itu yang paling penting.','cheer',90)+'<div class="row"><button class="big" onclick="go(16)">LANJUT ▶</button></div>'}
function rsel(i){S.rq=i;document.querySelectorAll('.rqb').forEach((b,j)=>b.classList.toggle('on',j==i));$('#ra').innerHTML='<textarea id="rt" placeholder="Tuliskan jawabanmu di sini..." aria-label="Jawaban refleksi">'+(S.refl&&S.refl.i===i?S.refl.t:'')+'</textarea><div class="row"><button class="g" onclick="rsave()">SIMPAN REFLEKSI</button></div><div id="rm" aria-live="polite"></div>'}
function rsave(){const t=$('#rt').value.trim();if(t.length<3){$('#rm').textContent='Tuliskan jawabanmu dulu ya, boleh singkat.';return}S.refl={i:S.rq,t:t};$('#rm').innerHTML=say('Nara','Terima kasih sudah jujur terhadap pengalamanmu.','happy',80)+say('Nero','Setiap pengalaman belajar itu berharga!','cheer',80)+'<div class="row"><button class="big" onclick="go(17)">LANJUT ▶</button></div>';confetti()}
function again(){S.done={};S.score=0;S.qa={};S.lab={};S.refl=null;go(2)}
go(0);
</script></body></html>
